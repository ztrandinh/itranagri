name: Deploy (Supabase + App)

# Kích hoạt THỦ CÔNG (repo nhiều phiên đang merge liên tục → không auto-deploy mỗi lần push main,
# tránh đẩy nửa vời lên production). Vào tab Actions → "Deploy (Supabase + App)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Môi trường deploy"
        type: choice
        options: [staging, production]
        default: staging

# Không cho 2 lượt deploy chồng nhau lên cùng môi trường
concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  # 1) CỔNG CHẤT LƯỢNG: dựng lại từ CSDL trắng + test + build (không xanh thì KHÔNG deploy)
  gate:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:17
        env: { POSTGRES_PASSWORD: itranagri, POSTGRES_DB: itranagri }
        ports: ["54499:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: "postgres://postgres:itranagri@localhost:54499/itranagri"
      DATABASE_URL: "postgres://app_user:app_user_pw@localhost:54499/itranagri"
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dựng lại từ trắng + gieo (luật 9)
        run: pnpm db:migrate && pnpm db:seed:history
      - name: Lint · types · test · build
        run: pnpm lint && pnpm exec tsc --noEmit && pnpm test && pnpm build

  # 2) ĐẨY MIGRATION lên Supabase (CSDL production). Cần secrets ở repo (xem docs/DEPLOY.md).
  db-push:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Đẩy migration (supabase db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::Thiếu secret SUPABASE_PROJECT_REF — khai ở Settings → Secrets (xem docs/DEPLOY.md)"; exit 1;
          fi
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

  # 3) DEPLOY APP. Bước Vercel chỉ chạy khi đã khai VERCEL_TOKEN; nếu chưa, chỉ build kiểm production.
  app:
    needs: db-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build production
        run: pnpm build
      - name: Deploy Vercel (bỏ qua nếu chưa khai VERCEL_TOKEN)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npx vercel pull --yes --environment=${{ github.event.inputs.target == 'production' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
          npx vercel build ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
