name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:17
        env: { POSTGRES_PASSWORD: itranagri, POSTGRES_DB: itranagri }
        ports: ["54499:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Chặn số migration trùng (đã xảy ra 2 lần do nhiều phiên chạy song song — xem docs/backlog.md)
        run: |
          dup=$(ls supabase/migrations | grep -oE '^[0-9]+' | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::Số migration trùng: $dup"; exit 1; fi
      - name: Quét dependency có lỗ hổng đã biết (high/critical) — không quét low/moderate để tránh gián đoạn vì lỗi chưa khai thác được
        run: pnpm audit --audit-level=high
      - name: Migrate
        env: { DATABASE_ADMIN_URL: "postgres://postgres:itranagri@localhost:54499/itranagri", DATABASE_URL: "postgres://app_user:app_user_pw@localhost:54499/itranagri", SESSION_SECRET: ci-secret }
        run: pnpm db:migrate
      - name: Seed dữ liệu (test tích hợp cần dữ liệu thật — lô/đàn/device_readings…)
        env: { DATABASE_ADMIN_URL: "postgres://postgres:itranagri@localhost:54499/itranagri", DATABASE_URL: "postgres://app_user:app_user_pw@localhost:54499/itranagri", SESSION_SECRET: ci-secret }
        run: pnpm db:seed:history
      - name: Lint & types
        run: pnpm lint && pnpm exec tsc --noEmit
      - name: Tests
        env: { DATABASE_ADMIN_URL: "postgres://postgres:itranagri@localhost:54499/itranagri", DATABASE_URL: "postgres://app_user:app_user_pw@localhost:54499/itranagri", SESSION_SECRET: ci-secret }
        run: pnpm test
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (login/ghi 3 chạm/offline) — trước đây Playwright cài mà 0 test nào
        env: { DATABASE_ADMIN_URL: "postgres://postgres:itranagri@localhost:54499/itranagri", DATABASE_URL: "postgres://app_user:app_user_pw@localhost:54499/itranagri", SESSION_SECRET: ci-secret, JOB_KEY: ci-job-key, E2E_PORT: "3199" }
        run: pnpm test:e2e
      - name: Build
        env: { DATABASE_ADMIN_URL: "postgres://postgres:itranagri@localhost:54499/itranagri", DATABASE_URL: "postgres://app_user:app_user_pw@localhost:54499/itranagri", SESSION_SECRET: ci-secret }
        run: pnpm build
